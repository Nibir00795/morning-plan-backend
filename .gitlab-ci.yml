stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: morning-plan-api

build:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
  script:
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA -t $DOCKER_IMAGE:latest .
    - docker save $DOCKER_IMAGE:latest | gzip > image.tar.gz
  artifacts:
    paths:
      - image.tar.gz
    expire_in: 1 hour
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts || true
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - scp -o StrictHostKeyChecking=no image.tar.gz $SERVER_USER@$SERVER_HOST:/opt/morning-plan/image.tar.gz
    - scp -o StrictHostKeyChecking=no docker-compose.prod.yml $SERVER_USER@$SERVER_HOST:/opt/morning-plan/docker-compose.yml
    - scp -o StrictHostKeyChecking=no deploy/nginx.conf $SERVER_USER@$SERVER_HOST:/opt/morning-plan/nginx.conf
    - |
      ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << 'ENDSSH'
        cd /opt/morning-plan
        docker load < image.tar.gz
        rm -f image.tar.gz
        docker compose up -d --force-recreate api
        docker image prune -f
        echo "Deployment complete"
      ENDSSH
  only:
    - main
  environment:
    name: production
    url: http://$SERVER_HOST
