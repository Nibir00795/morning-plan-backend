stages:
  - build
  - deploy

variables:
  DOCKER_IMAGE: morning-plan-api
  DEPLOY_DIR: /home/nibir/morning-plan

build:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker info
  script:
    - docker build -t $DOCKER_IMAGE:$CI_COMMIT_SHORT_SHA -t $DOCKER_IMAGE:latest .
    - docker save $DOCKER_IMAGE:latest | gzip > image.tar.gz
  artifacts:
    paths:
      - image.tar.gz
    expire_in: 1 hour
  only:
    - main

deploy:
  stage: deploy
  image: ubuntu:22.04
  variables:
    SSH_KEY_FILE: /tmp/deploy_key.pem
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client
    # SSH key: File type = path; Variable type (Masked=No) = key content. Use PEM format (-----BEGIN RSA PRIVATE KEY-----).
    - |
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        cp "$SSH_PRIVATE_KEY" /tmp/deploy_key.pem
      elif [ -n "$SSH_PRIVATE_KEY" ]; then
        printf '%s' "$SSH_PRIVATE_KEY" | tr -d '\r' > /tmp/deploy_key.pem
      else
        echo "ERROR: Set SSH_PRIVATE_KEY (File or Variable, Masked=No) in GitLab CI/CD"
        exit 1
      fi
      chmod 600 /tmp/deploy_key.pem
      head -1 /tmp/deploy_key.pem | grep -q "BEGIN.*PRIVATE KEY" || { echo "ERROR: Invalid key. Use PEM format (ssh-keygen -t rsa -m PEM)"; exit 1; }
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts 2>/dev/null || true
  script:
    - scp -i $SSH_KEY_FILE -o StrictHostKeyChecking=no image.tar.gz $SERVER_USER@$SERVER_HOST:$DEPLOY_DIR/image.tar.gz
    - scp -i $SSH_KEY_FILE -o StrictHostKeyChecking=no docker-compose.prod.yml $SERVER_USER@$SERVER_HOST:$DEPLOY_DIR/docker-compose.yml
    - scp -i $SSH_KEY_FILE -o StrictHostKeyChecking=no deploy/nginx.conf $SERVER_USER@$SERVER_HOST:$DEPLOY_DIR/nginx.conf
    - |
      ssh -i $SSH_KEY_FILE -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST << ENDSSH
        cd $DEPLOY_DIR
        docker load < image.tar.gz
        rm -f image.tar.gz
        docker compose up -d --force-recreate api
        docker image prune -f
        echo "Deployment complete"
      ENDSSH
  only:
    - main
  environment:
    name: production
    url: http://$SERVER_HOST
